# ArgoCD Application — kube-prometheus-stack
#
# Prometheus Operator, Prometheus, Grafana, kube-state-metrics and
# node-exporter in one chart. Values live in apps/kube-prometheus-stack/.
#
# Sync wave 0: runs after MetalLB (-2) and Traefik (-1) so the Grafana
# HTTPRoute can be served as soon as it exists.
#
# ServerSideApply is required: the operator CRDs exceed the size limit of
# the client-side last-applied annotation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # Source 1: The kube-prometheus-stack Helm chart
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.10.1
      helm:
        valueFiles:
          - $values/apps/kube-prometheus-stack/values.yaml
    # Source 2: This repo, used only as a $values reference.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      ref: values
    # Source 3: Supporting manifests in apps/kube-prometheus-stack/
    # (IngressRoutes etc.). values.yaml is excluded since Source 1 consumes it.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      path: apps/kube-prometheus-stack
      directory:
        recurse: true
        exclude: 'values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
