# ArgoCD Application — cert-manager
#
# Issues and renews TLS certificates in-cluster. First consumer is the
# bitwarden-sdk-server deployed alongside External Secrets Operator.
#
# Sync wave -2: operator. Its CRDs come from cert-manager-crds (wave -3),
# so they are established before this app starts. Inside this app the
# chart is wave 0 and the ClusterIssuers/Certificate in apps/cert-manager/
# are wave 1, so the webhook is running before they are applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    # Source 1: The cert-manager Helm chart
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        valueFiles:
          - $values/apps/cert-manager/values.yaml
    # Source 2: This repo, used only as a $values reference.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      ref: values
    # Source 3: This repo, providing the ClusterIssuers and root CA
    # Certificate in apps/cert-manager/ (values.yaml is excluded since
    # Source 1 consumes it via $values).
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      path: apps/cert-manager
      directory:
        recurse: true
        exclude: 'values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
