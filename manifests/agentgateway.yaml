# ArgoCD Application — Agentgateway
#
# After bootstrap, ArgoCD takes over management of Agentgateway using this
# manifest. It points at the Helm chart with the same values.yaml used
# during bootstrap, ensuring the configuration stays consistent.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  sources:
    # Source 1: agentgateway CRDs
    - repoURL: cr.agentgateway.dev/charts
      chart: agentgateway-crds
      targetRevision: v1.6.0
      helm:
        skipCrds: false
        parameters:
        - name: controller.image.pullPolicy
          value: "Always"
        - name: controller.extraEnv.AGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES
          value: "true"
        valueFiles:
          - $values/apps/agentgateway/values.yaml
    # Source 2: This repo, used only as a $values reference for the Helm
    # chart above. The ref: values makes it available as $values variable.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      ref: values
    # Source 3: This repo, providing all supporting manifests in apps/agentgateway/
    # (middlewares, IngressRoutes, TLSStore, certificates, etc.)
    # Excludes values.yaml since that is consumed by Source 1 via $values,
    # not applied directly as a manifest.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      path: apps/agentgateway
      directory:
        recurse: true
        exclude: 'values.yaml'
  syncPolicy:
    automated:
      # Prune resources during auto-syncing
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true