# ArgoCD Application — agentgateway
#
# Installs the agentgateway controller plus the gateway-api Gateway and
# agentgateway backends in apps/agentgateway/. The CRDs come from
# agentgateway-crds (wave -3) and gateway-api-crds (wave -3), so they are
# established before this app starts.
#
# Sync wave 0: workload (default).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway
  sources:
    # Source 1: The agentgateway controller Helm chart
    - repoURL: cr.agentgateway.dev/charts
      chart: agentgateway
      targetRevision: v1.6.0
      helm:
        valueFiles:
          - $values/apps/agentgateway/values.yaml
    # Source 2: This repo, used only as a $values reference for the Helm
    # chart above. The ref: values makes it available as $values variable.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      ref: values
    # Source 3: This repo, providing all supporting manifests in apps/agentgateway/
    # (gateway-api Gateway, agentgateway backends, OTel collector).
    # Excludes values.yaml since that is consumed by Source 1 via $values,
    # not applied directly as a manifest.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      path: apps/agentgateway
      directory:
        recurse: true
        exclude: 'values.yaml'
  syncPolicy:
    automated:
      # Prune resources during auto-syncing
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
