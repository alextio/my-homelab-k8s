# ArgoCD Application — Stakater Reloader
#
# Rolls a workload when a Secret or ConfigMap it uses changes. Argo CD syncs
# the Secret but never restarts its consumers, and chart checksum annotations
# can't follow Secrets that ESO renders at runtime. Workloads opt in with a
# pod annotation; see apps/reloader/values.yaml.
#
# Sync wave -2: controller. No CRDs, and nothing else depends on it being up
# first; a reload missed before it starts just means a manual restart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    # See AGENTS.md "Sync waves".
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    # Source 1: The Reloader Helm chart (Reloader v1.4.24)
    - repoURL: https://stakater.github.io/stakater-charts
      chart: reloader
      targetRevision: 2.2.20
      helm:
        valueFiles:
          - $values/apps/reloader/values.yaml
    # Source 2: This repo, used only as a $values reference.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: {{ .Values.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Waves only order creation; retry until earlier waves are up. See
    # AGENTS.md "Sync waves".
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
