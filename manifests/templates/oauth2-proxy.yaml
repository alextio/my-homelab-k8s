# ArgoCD Application — oauth2-proxy
#
# Dex login in front of services with no OIDC support of their own
# (Prometheus, the Traefik dashboard, AdGuard Home), via Traefik forwardAuth.
# See apps/oauth2-proxy/values.yaml for how it fits together.
#
# Wave 0 (workloads); needs dex (0), trust-manager (-2) for the CA ConfigMap
# and external-secrets (-2). None is waited on: the pod restarts until Dex
# answers, and the sync retries until the rest is up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  annotations:
    # See AGENTS.md "Sync waves".
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # Source 1: The oauth2-proxy Helm chart
    - repoURL: https://oauth2-proxy.github.io/manifests
      chart: oauth2-proxy
      targetRevision: 10.7.4
      helm:
        valueFiles:
          - $values/apps/oauth2-proxy/values.yaml
    # Source 2: This repo, used only as a $values reference.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: {{ .Values.revision }}
      ref: values
    # Source 3: This repo, providing the ExternalSecret and ReferenceGrant in
    # apps/oauth2-proxy/ (values.yaml is excluded since Source 1 consumes it).
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: {{ .Values.revision }}
      path: apps/oauth2-proxy
      directory:
        recurse: true
        exclude: 'values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: oauth2-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Waves only order creation; retry until earlier waves are up. See
    # AGENTS.md "Sync waves".
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
