# ArgoCD Application — cert-manager CRDs
#
# Installs only the cert-manager CRDs, separate from the cert-manager chart
# (crds.enabled: false in apps/cert-manager/values.yaml), so they are
# created before anything uses them. Mirrors
# gateway-api-crds.
#
# Sync wave -3: CRDs only. cert-manager (wave -2) and other users of these
# CRDs retry their sync until the CRDs are established.
#
# prune: false — deleting a CRD deletes every Certificate/Issuer of that
# kind, so a bad sync must never remove them.
#
# The CRD version lives in apps/cert-manager-crds/kustomization.yaml and
# must match the chart targetRevision in manifests/templates/cert-manager.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-crds
  namespace: argocd
  annotations:
    # See AGENTS.md "Sync waves".
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/alextio/my-homelab-k8s
    targetRevision: {{ .Values.revision }}
    path: apps/cert-manager-crds
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    # Waves only order creation; retry until earlier waves are up. See
    # AGENTS.md "Sync waves".
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
