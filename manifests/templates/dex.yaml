# ArgoCD Application — Dex
#
# OIDC identity provider. First consumer is Eclipse Che (login + the
# Kubernetes API server trusting its tokens, see apps/dex/values.yaml).
#
# Wave 0 (workloads). The ExternalSecret in apps/dex/ is also wave 0: the
# Dex pod will wait on the dex-config Secret and start once ESO writes it.
# Requires external-secrets (ClusterSecretStore "bitwarden"); retries until it is up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: The Dex Helm chart
    - repoURL: https://charts.dexidp.io
      chart: dex
      targetRevision: 0.26.0
      helm:
        valueFiles:
          - $values/apps/dex/values.yaml
    # Source 2: This repo, used only as a $values reference.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: {{ .Values.revision }}
      ref: values
    # Source 3: This repo, providing the ExternalSecret and HTTPRoute in
    # apps/dex/ (values.yaml is excluded since Source 1 consumes it).
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: {{ .Values.revision }}
      path: apps/dex
      directory:
        recurse: true
        exclude: 'values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: dex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Waves only order creation; retry until earlier waves are up. See
    # AGENTS.md "Sync waves".
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
