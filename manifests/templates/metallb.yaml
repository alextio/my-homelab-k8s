apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"  # operator
spec:
  project: default
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.16.1
      helm:
        valueFiles:
          - $values/apps/metallb/values.yaml
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: {{ .Values.revision }}
      ref: values
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: {{ .Values.revision }}
      path: apps/metallb
      directory:
        recurse: true
        exclude: 'values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Waves only order creation; retry until earlier waves are up. See
    # AGENTS.md "Sync waves".
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

