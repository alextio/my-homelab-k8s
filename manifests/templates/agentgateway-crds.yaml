# ArgoCD Application — agentgateway CRDs
#
# Installs only the agentgateway CRDs, separate from the agentgateway
# controller chart (manifests/templates/agentgateway.yaml), so the CRDs
# are created before anything uses them. Mirrors cert-manager-crds.
#
# Sync wave -3: CRDs only. agentgateway (wave 0) retries its sync until
# these CRDs are established.
#
# prune: false — deleting a CRD deletes every resource of that kind, so a
# bad sync must never remove them.
#
# The chart version here must match the targetRevision in
# manifests/templates/agentgateway.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-crds
  namespace: argocd
  annotations:
    # See AGENTS.md "Sync waves".
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: cr.agentgateway.dev/charts
    chart: agentgateway-crds
    targetRevision: v1.6.0
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    # Waves only order creation; retry until earlier waves are up. See
    # AGENTS.md "Sync waves".
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
