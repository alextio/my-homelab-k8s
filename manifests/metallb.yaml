apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"  # traefik waits on this (wave -1)
spec:
  project: default
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.16.1
      helm:
        valueFiles:
          - $values/apps/metallb/values.yaml
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/alextio/my-homelab-k8s  
      targetRevision: HEAD
      path: apps/metallb
      directory:
        recurse: true
        exclude: 'values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

