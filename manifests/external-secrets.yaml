# ArgoCD Application — External Secrets Operator
#
# Syncs secrets from Bitwarden Secrets Manager into Kubernetes Secrets.
# Deploys bitwarden-sdk-server alongside the operator; the ClusterSecretStore
# talks to it over TLS using a cert issued by cert-manager's homelab-ca.
#
# Sync wave -2: operator. Needs cert-manager (also -2) only for the
# Certificate, which is wave 1 inside this app, so it is applied after
# the chart and retries until homelab-ca is ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"  # operators, see CLAUDE.md sync waves
spec:
  project: default
  sources:
    # Source 1: The External Secrets Helm chart
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        valueFiles:
          - $values/apps/external-secrets/values.yaml
    # Source 2: This repo, used only as a $values reference.
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      ref: values
    # Source 3: This repo, providing the sdk-server Certificate and the
    # ClusterSecretStore in apps/external-secrets/ (values.yaml is excluded
    # since Source 1 consumes it via $values).
    - repoURL: https://github.com/alextio/my-homelab-k8s
      targetRevision: HEAD
      path: apps/external-secrets
      directory:
        recurse: true
        exclude: 'values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
