# App of Apps — Root Application
#
# This is the single entry point that connects ArgoCD to this repository.
#
# ── What it does ─────────────────────────────────────────────────────────────
# Points at ./manifests/, a Helm chart with one Application manifest per
# component in manifests/templates/. ArgoCD renders the chart, creates each
# child Application, and each child then manages its own directory under
# apps/<name>/ independently. manifests/values.yaml sets the git revision the
# children read; its defaults are prod. See AGENTS.md "Manifests are a Helm
# chart".
#
# Adding a new application:
#   1. Create apps/<app-name>/ with your manifests and a values.yaml
#   2. Add manifests/templates/<app-name>.yaml; every source pointing at this
#      repo uses targetRevision: {{ .Values.revision }}
#   3. Commit and push to main
#   4. ArgoCD discovers it automatically on next sync — no manual apply needed
#
# Removing an application:
#   1. Delete manifests/templates/<app-name>.yaml
#   2. Commit and push to main
#   3. ArgoCD prunes the Application and all resources it managed
#   4. Optionally delete the apps/<app-name>/ directory
#
# ── When to update this file ─────────────────────────────────────────────────
# This file rarely needs changing. You would update it if you:
#   - Rename or restructure the manifests/ directory
#   - Change the target repository or branch
#
# ── How to update this file ──────────────────────────────────────────────────
# Since ArgoCD does not manage this file, changes must be applied manually:
#   1. Make your changes and commit to main
#   2. Apply the updated manifest:
#      kubectl apply -f app-of-apps.yaml
#   3. Verify ArgoCD reflects the change correctly in the UI
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alextio/my-homelab-k8s
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true