# Client secret for the `argocd` client in Dex (apps/dex/externalsecret.yaml
# reads the same Bitwarden entry). oidc.config in values.yaml references it as
# $argocd-dex-oidc:clientSecret; Argo CD only resolves Secrets that carry the
# part-of label.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-dex-oidc
  namespace: argocd
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: argocd-dex-oidc
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef:
        key: 052a2466-00db-4ec4-af4d-b50700eff853  # dex-argocd-client-secret
