# argocd.lan and argocd.alextio.duckdns.org on the shared Traefik Gateway.
# Needed for SSO: Dex redirects the browser back to /auth/callback on
# whichever name the login started on (url and additionalUrls in
# values.yaml). argocd-server serves plain
# HTTP (server.insecure in values.yaml); Traefik terminates TLS.
#
# The CLI works through it with gRPC-web:
#   argocd login argocd.alextio.duckdns.org --sso --grpc-web
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Argo CD
    gethomepage.dev/description: GitOps deployments
    gethomepage.dev/group: Cluster Management
    gethomepage.dev/icon: argo-cd.png
spec:
  # Attached to both listeners while moving to the Let's Encrypt name; each
  # listener only serves the hostname that matches it.
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
    - name: traefik
      namespace: traefik
      sectionName: websecure-duckdns
  hostnames:
    - argocd.lan
    - argocd.alextio.duckdns.org
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
