# argocd.lan on the shared Traefik Gateway. Needed for SSO: Dex redirects the
# browser back to https://argocd.lan/auth/callback. argocd-server serves plain
# HTTP (server.insecure in values.yaml); Traefik terminates TLS.
#
# The CLI works through it with gRPC-web:
#   argocd login argocd.lan --sso --grpc-web
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Argo CD
    gethomepage.dev/description: GitOps deployments
    gethomepage.dev/group: Cluster Management
    gethomepage.dev/icon: argo-cd.png
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - argocd.lan
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
