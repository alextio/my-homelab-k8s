# Bitwarden Secrets Manager store. Reference it from ExternalSecrets with
#   secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
# and use the Bitwarden secret's UUID as remoteRef.key.
#
# The access token Secret is NOT in git. Create it once by hand:
#   kubectl -n external-secrets create secret generic bitwarden-access-token \
#     --from-literal=token='<machine-account-access-token>'
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # after the chart (wave 0): needs the ESO CRDs and webhook
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com            # EU cloud: https://api.bitwarden.eu
      identityURL: https://identity.bitwarden.com  # EU cloud: https://identity.bitwarden.eu
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      organizationID: b55013ec-dd33-4281-a52a-b4eb017b7077    # UUID for eso-1
      projectID: 98dc6b41-b5d9-403c-8797-b4eb017c7b2f         # k3s-prod
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets
        key: ca.crt
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            namespace: external-secrets
            key: token
