apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Prometheus
    gethomepage.dev/description: Metrics storage and queries
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: prometheus.png
spec:
  # Attached to both listeners while moving to the Let's Encrypt name; each
  # listener only serves the hostname that matches it.
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
    - name: traefik
      namespace: traefik
      sectionName: websecure-duckdns
  hostnames:
    - prometheus.lan
    - prometheus.alextio.duckdns.org
  rules:
    # Login callback and sign-out go straight to oauth2-proxy, so its cookie
    # is set on the requested host (allowed by
    # apps/oauth2-proxy/referencegrant.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2/
      backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    # Prometheus has no login of its own; require Dex login on every hostname
    # above (this rule has no host match, so a new hostname is covered too)
    # (middleware-oauth2-proxy.yaml). Grafana queries Prometheus through its
    # Service, not this route, so it isn't affected.
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-proxy
      backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
