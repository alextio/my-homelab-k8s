apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Grafana
    gethomepage.dev/description: Metrics dashboards
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: grafana.png
spec:
  # Attached to both listeners while moving to the Let's Encrypt name; each
  # listener only serves the hostname that matches it. Drop the .lan pair once
  # grafana.alextio.duckdns.org is the only name in use.
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
    - name: traefik
      namespace: traefik
      sectionName: websecure-duckdns
  hostnames:
    - grafana.lan
    - grafana.alextio.duckdns.org
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
