# Client secret for the `grafana` client in Dex (apps/dex/externalsecret.yaml
# reads the same Bitwarden entry), for GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET in
# values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-dex-oidc
  namespace: monitoring
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-dex-oidc
  data:
    - secretKey: clientSecret
      remoteRef:
        key: 3ac2fe8c-d86c-4648-afb3-b50700effc67  # dex-grafana-client-secret
