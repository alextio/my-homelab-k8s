# kube-prometheus-stack values (k3s)
# Only overrides are listed; see `helm show values` for all defaults.

# k3s runs these inside a single process and binds their metrics to
# localhost, so the default scrape jobs would be permanently down.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

alertmanager:
  enabled: false   # no receiver configured yet

prometheus:
  prometheusSpec:
    retention: 15d
    # Pick up ServiceMonitors/PodMonitors from any namespace and without
    # the Helm release label (needed for traefik, agentgateway, etc.).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path   # k3s default
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  # Reloader (apps/reloader/values.yaml): roll Grafana when its OIDC client
  # secret or the homelab CA change.
  podAnnotations:
    secret.reloader.stakater.com/reload: "grafana-dex-oidc"
    configmap.reloader.stakater.com/reload: "homelab-root-ca"
  # Throwaway bootstrap password. Grafana only reads it when it first creates
  # its database; change it in the UI afterwards.
  adminPassword: change-me-please
  persistence:
    enabled: true
    size: 5Gi
  service:
    type: ClusterIP
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/nodes.json # path is inside grafana container
    server:
      # Grafana builds links and the OAuth callback
      # (https://grafana.alextio.duckdns.org/login/generic_oauth) from this.
      # The Let's Encrypt name; grafana.lan still serves (httproute-grafana.yaml),
      # but logins land on this name.
      root_url: https://grafana.alextio.duckdns.org
    # Login through Dex (apps/dex/). The local admin login keeps working as a
    # fallback. client_secret comes from GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
    # (envValueFrom below).
    auth.generic_oauth:
      enabled: true
      name: Dex
      client_id: grafana
      scopes: openid profile email
      auth_url: https://dex.lan/auth
      token_url: https://dex.lan/token
      api_url: https://dex.lan/userinfo
      use_pkce: true
      login_attribute_path: preferred_username
      # Dex's static users have no groups, so pick the role by email. Anyone
      # else who logs in through Dex is a Viewer.
      role_attribute_path: "email == 'alex@homelab.lan' && 'Admin' || 'Viewer'"
      # The homelab CA, mounted by extraConfigmapMounts below.
      tls_client_ca: /etc/grafana/homelab-root-ca/ca.crt
  envValueFrom:
    # Written by apps/kube-prometheus-stack/externalsecret-grafana-dex-oidc.yaml.
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-dex-oidc
        key: clientSecret
  # Written into every namespace by trust-manager (apps/trust-manager/).
  extraConfigmapMounts:
    - name: homelab-root-ca
      configMap: homelab-root-ca
      mountPath: /etc/grafana/homelab-root-ca
      readOnly: true