# oauth2-proxy's credentials, in the key names the chart expects
# (config.existingSecret in values.yaml). client-secret is the same Bitwarden
# entry as the oauth2-proxy client in apps/dex/externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: oauth2-proxy
    template:
      data:
        client-id: oauth2-proxy
        client-secret: "{{ .clientSecret }}"
        # 32 random characters; oauth2-proxy uses them directly as an
        # AES-256 key for the session cookie.
        cookie-secret: "{{ .cookieSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: 0041de47-229f-4345-8294-b50700f000d3  # dex-oauth2-proxy-client-secret
    - secretKey: cookieSecret
      remoteRef:
        key: 05cee2a2-c722-4cca-8a84-b50700f0027b  # oauth2-proxy-cookie-secret
