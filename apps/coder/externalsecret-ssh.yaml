# SSH key and known_hosts for Coder's Docker provider, which reaches the
# rootless Podman socket on coder-1 as ssh://coder-1 (see
# configmap-ssh.yaml). Mounted at /home/coder/.ssh in values.yaml.
#
# On coder-1 the key only works from the k3s node's IP and can only run
# `podman system dial-stdio` (02-ansible group_vars/podman_docker), so it
# reaches the Podman API as user `coder` and nothing else: no shell, no
# port forwarding, no sudo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-ssh
  namespace: coder
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: coder-ssh
  data:
    # Stored base64-encoded because the private key needs its trailing
    # newline, which the Bitwarden upsert script would strip.
    - secretKey: id_ed25519
      remoteRef:
        key: a4cd83fb-026d-49f3-9315-b5070187614c  # coder-ssh-private-key-b64
        decodingStrategy: Base64
    - secretKey: known_hosts
      remoteRef:
        key: 215cf50f-ea66-4e44-ad19-b507018762be  # coder-ssh-known-hosts
