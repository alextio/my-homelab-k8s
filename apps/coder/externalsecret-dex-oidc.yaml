# Client secret for the `coder` client in Dex (apps/dex/externalsecret.yaml
# reads the same Bitwarden entry), for CODER_OIDC_CLIENT_SECRET in values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-dex-oidc
  namespace: coder
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: coder-dex-oidc
  data:
    - secretKey: clientSecret
      remoteRef:
        key: 0ddb3b11-1d8b-4889-b149-b50700effa0d  # dex-coder-client-secret
