# Coder's PostgreSQL connection URL, for CODER_PG_CONNECTION_URL in
# values.yaml. Same Bitwarden entry as the `coder` role's password in
# apps/postgres/coder.yaml.
#
# sslmode=require: CNPG serves TLS with its own self-signed CA, so the
# connection is encrypted but the server cert isn't verified.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-url
  namespace: coder
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: coder-db-url
    template:
      data:
        url: "postgres://coder:{{ .password }}@postgres-rw.postgres.svc.cluster.local:5432/coder?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: e77c331e-0354-4e1f-8577-b504018b3f8b  # coder-postgres-password
