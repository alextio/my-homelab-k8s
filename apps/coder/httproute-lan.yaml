# Legacy coder.lan route, kept so old bookmarks and CLI logins keep working.
# Coder's main route (coder.httproute in values.yaml) serves the access URL,
# coder.alextio.duckdns.org; the chart's route takes a single host, so this
# one is raw. It mirrors that route's backend (Service coder, port 80).
# Coder still builds links and the OIDC callback on the access URL, so a
# login started here finishes on coder.alextio.duckdns.org.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-lan
  namespace: coder
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - coder.lan
  rules:
    - backendRefs:
        - name: coder
          port: 80
