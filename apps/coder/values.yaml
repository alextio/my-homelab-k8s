# Chart: coder-v2/coder (https://helm.coder.com/v2)
# Coder is configured almost entirely through CODER_* environment variables.
coder:
  env:
    # Built by apps/coder/externalsecret.yaml; points at the shared
    # CloudNativePG cluster (postgres-rw.postgres).
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url
    # The URL users and workspace agents reach Coder on. Setting it also
    # stops the chart defaulting it to the in-cluster Service URL
    # (envUseClusterAccessURL).
    - name: CODER_ACCESS_URL
      value: https://coder.lan
    # Login through Dex (apps/dex/). Password login stays enabled so the
    # existing owner account still works. Coder only accepts verified emails;
    # Dex marks its static users verified.
    - name: CODER_OIDC_ISSUER_URL
      value: https://dex.lan
    - name: CODER_OIDC_CLIENT_ID
      value: coder
    - name: CODER_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: coder-dex-oidc
          key: clientSecret
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: Sign in with Dex
    # No CODER_WILDCARD_ACCESS_URL yet: workspace apps are served on paths
    # under coder.lan. A subdomain wildcard needs a matching TLS cert and DNS
    # (*.coder.lan isn't covered by the *.lan wildcard).

  service:
    # Chart default is LoadBalancer, which would take a MetalLB IP. Traffic
    # comes through the Traefik Gateway instead.
    type: ClusterIP

  # Chart-rendered HTTPRoute on the shared Traefik Gateway. DNS (*.lan ->
  # Traefik) and TLS (*.lan wildcard cert) already cover coder.lan; Coder
  # itself serves plain HTTP behind it.
  httproute:
    enable: true
    host: coder.lan
    parentRefs:
      - name: traefik
        namespace: traefik
        sectionName: websecure

  # Trust the homelab CA for the calls to https://dex.lan. The ConfigMap is
  # written into every namespace by trust-manager (apps/trust-manager/). Go
  # reads every file in /etc/ssl/certs on top of the image's bundle.
  volumes:
    - name: homelab-root-ca
      configMap:
        name: homelab-root-ca
  volumeMounts:
    - name: homelab-root-ca
      mountPath: /etc/ssl/certs/homelab-root-ca.crt
      subPath: ca.crt
      readOnly: true
