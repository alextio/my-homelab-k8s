# Chart: coder-v2/coder (https://helm.coder.com/v2)
# Coder is configured almost entirely through CODER_* environment variables.
coder:
  # Reloader (apps/reloader/values.yaml): roll when the DB URL, OIDC secret or
  # homelab CA change. The CA is a subPath mount, which never updates in a
  # running pod, so a CA rotation needs this restart.
  podAnnotations:
    secret.reloader.stakater.com/reload: "coder-db-url,coder-dex-oidc"
    configmap.reloader.stakater.com/reload: "homelab-root-ca"

  env:
    # Built by apps/coder/externalsecret.yaml; points at the shared
    # CloudNativePG cluster (postgres-rw.postgres).
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url
    # The URL users reach Coder on, and the base for links and the OIDC
    # callback. The Let's Encrypt name, so browsers need no homelab CA.
    # Workspace agents don't use it: the kubernetes template points them at
    # http://coder.coder.svc.cluster.local. Setting it also stops the chart
    # defaulting it to the in-cluster Service URL (envUseClusterAccessURL).
    - name: CODER_ACCESS_URL
      value: https://coder.alextio.duckdns.org
    # Login through Dex (apps/dex/). Password login stays enabled so the
    # existing owner account still works. Coder only accepts verified emails;
    # Dex marks its static users verified.
    - name: CODER_OIDC_ISSUER_URL
      value: https://dex.lan
    - name: CODER_OIDC_CLIENT_ID
      value: coder
    - name: CODER_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: coder-dex-oidc
          key: clientSecret
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: Sign in with Dex
    # No CODER_WILDCARD_ACCESS_URL yet: workspace apps are served on paths
    # under the access URL. A subdomain wildcard needs its own TLS cert and
    # DNS: *.alextio.duckdns.org only covers one level, not
    # *.coder.alextio.duckdns.org.

  service:
    # Chart default is LoadBalancer, which would take a MetalLB IP. Traffic
    # comes through the Traefik Gateway instead.
    type: ClusterIP

  # Chart-rendered HTTPRoute on the shared Traefik Gateway's Let's Encrypt
  # listener. DNS (AdGuard *.alextio.duckdns.org -> Traefik) and TLS (the
  # traefik-wildcard-duckdns cert) cover it; Coder itself serves plain HTTP
  # behind it. coder.lan keeps working through httproute-lan.yaml.
  httproute:
    enable: true
    host: coder.alextio.duckdns.org
    parentRefs:
      - name: traefik
        namespace: traefik
        sectionName: websecure-duckdns

  # Trust the homelab CA for the calls to https://dex.lan. The ConfigMap is
  # written into every namespace by trust-manager (apps/trust-manager/). Go
  # reads every file in /etc/ssl/certs on top of the image's bundle.
  volumes:
    - name: homelab-root-ca
      configMap:
        name: homelab-root-ca
  volumeMounts:
    - name: homelab-root-ca
      mountPath: /etc/ssl/certs/homelab-root-ca.crt
      subPath: ca.crt
      readOnly: true

  serviceAccount:
    # No workspace permissions in Coder's own namespace: a pod created there
    # could mount coder-db-url and coder-dex-oidc.
    workspacePerms: false
    # Templates create workspaces (Deployment + PVC) in coder-workspaces
    # (namespace-workspaces.yaml) only. The chart renders a Role there and
    # binds it to Coder's service account.
    workspaceNamespaces:
      - name: coder-workspaces
        workspacePerms: true
        enableDeployments: true

  # The chart defaults to requests = limits = 2 CPU / 4Gi. On the single
  # 4-CPU node that left no room to surge a second pod, so every rollout
  # stuck Pending. Coder is mostly idle; workspaces run on coder-1, not
  # here. Limits keep the old ceiling for template builds.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
