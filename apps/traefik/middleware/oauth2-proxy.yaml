# Dex login via oauth2-proxy (apps/oauth2-proxy/). Traefik sends each request's
# headers (incl. the session cookie) to oauth2-proxy first: 202 lets the
# request through, anything else (a redirect to Dex) goes back to the browser.
#
# Used by the dashboard IngressRoute (ingressroute-dashboard.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy
  namespace: traefik
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
