# Wildcard certificate for the shared Gateway's websecure-duckdns listener.
# secretName must match that listener's certificateRefs in gateway.yaml.
# Publicly trusted (Let's Encrypt via the duckdns webhook, apps/duckdns/), so
# clients don't need the homelab root CA for *.alextio.duckdns.org hosts.
#
# Issued by production. It was first tested on duckdns-letsencrypt-staging;
# switch back to that issuer when debugging, so failed attempts don't count
# against production rate limits. Changing issuerRef makes cert-manager
# reissue on its own (reason IncorrectIssuer).
#
# Only the wildcard: DuckDNS keeps one TXT record per domain, so adding the
# bare alextio.duckdns.org here would make the two challenges collide.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-wildcard-duckdns
  namespace: traefik
spec:
  secretName: traefik-duckdns-tls
  dnsNames:
    - "*.alextio.duckdns.org"
  issuerRef:
    name: duckdns-letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
