apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway
spec:
  gatewayClassName: agentgateway
  infrastructure:
    annotations:
      # Propagated to the generated agentgateway-proxy Service to pin its MetalLB IP.
      # Keep in sync with the IP table in AGENTS.md.
      metallb.io/loadBalancerIPs: "192.168.6.202"
  listeners:
  - protocol: HTTP
    port: 8080
    name: http
    allowedRoutes:
      namespaces:
        from: All
  - protocol: HTTPS
    port: 443
    name: https
    hostname: agentgateway.lan
    tls:
      mode: Terminate
      certificateRefs:
      # Written by the agentgateway-tls Certificate (certificate.yaml).
      - name: agentgateway-tls
    allowedRoutes:
      namespaces:
        from: All