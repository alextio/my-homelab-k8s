apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway
spec:
  gatewayClassName: agentgateway
  infrastructure:
    # Scales the proxy to zero for now (parameters-proxy.yaml).
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agentgateway-proxy
    annotations:
      # Propagated to the generated agentgateway-proxy Service to pin its MetalLB IP.
      # Keep in sync with the IP table in AGENTS.md.
      metallb.io/loadBalancerIPs: "192.168.6.202"
  listeners:
  - protocol: HTTP
    port: 8080
    name: http
    allowedRoutes:
      namespaces:
        from: All
  - protocol: HTTPS
    port: 443
    name: https
    hostname: agentgateway.lan
    tls:
      mode: Terminate
      certificateRefs:
      # Written by the agentgateway-tls Certificate (certificate.yaml).
      - name: agentgateway-tls
    allowedRoutes:
      namespaces:
        from: All
  # Same port, picked by SNI: the Let's Encrypt name, so clients need no
  # homelab CA. Routes without a sectionName attach to every listener.
  - protocol: HTTPS
    port: 443
    name: https-duckdns
    hostname: agentgateway.alextio.duckdns.org
    tls:
      mode: Terminate
      certificateRefs:
      # Written by the agentgateway-duckdns-tls Certificate
      # (certificate-duckdns.yaml).
      - name: agentgateway-duckdns-tls
    allowedRoutes:
      namespaces:
        from: All