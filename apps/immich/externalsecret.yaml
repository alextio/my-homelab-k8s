# One Secret feeds the Immich server and both subcharts. Key names are the
# chart defaults: the server reads postgres-password (DB user is postgres)
# and valkey-password; the PostgreSQL subchart also expects user-password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-credentials
  namespace: immich
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-credentials
    template:
      data:
        postgres-password: "{{ .postgresPassword }}"
        user-password: "{{ .postgresPassword }}"
        valkey-password: "{{ .valkeyPassword }}"
  data:
    - secretKey: postgresPassword
      remoteRef:
        key: 531ae0b9-fb8d-460d-96c9-b504018b3aa8  # immich-postgres-password
    - secretKey: valkeyPassword
      remoteRef:
        key: ddd281ce-eda1-4179-95ca-b504018b3d1a  # immich-valkey-password
