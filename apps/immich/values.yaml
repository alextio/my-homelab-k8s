# Chart: helmforge/immich (https://repo.helmforge.dev)
# Bundles Immich server, PostgreSQL (VectorChord image) and Redis (aliased
# as valkey). Credentials come from Bitwarden via externalsecret.yaml.

# Stable resource names (immich, immich-postgresql, immich-valkey-client),
# independent of the Argo release name.
fullnameOverride: immich

server:
  # Pairs with machineLearning.enabled=false below: stops the server calling
  # the (absent) ML service and queueing jobs that would only fail.
  extraEnv:
    - name: IMMICH_MACHINE_LEARNING_ENABLED
      value: "false"
    # Trust the homelab CA (extraVolumes below) for the OAuth calls to
    # https://dex.lan. Node adds this to its built-in CA list.
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/homelab-root-ca/ca.crt
  persistence:
    # local-path (k3s default, reclaimPolicy Delete): the library lives on the
    # node's disk and is removed with the PVC. Fine to start; move to
    # dedicated storage before relying on it.
    size: 50Gi

# Homelab CA, written into every namespace by trust-manager
# (apps/trust-manager/). Used by NODE_EXTRA_CA_CERTS above.
#
# The OAuth (Dex) settings themselves are not here: Immich keeps them in its
# database and edits them in Administration > Settings > OAuth. Setting them
# from a config file (IMMICH_CONFIG_FILE) would lock every other admin
# setting in the UI. Values to enter: issuer https://dex.lan, client ID
# immich, client secret from Bitwarden entry dex-immich-client-secret.
extraVolumes:
  - name: homelab-root-ca
    configMap:
      name: homelab-root-ca
extraVolumeMounts:
  - name: homelab-root-ca
    mountPath: /etc/homelab-root-ca
    readOnly: true

# Reloader (apps/reloader/values.yaml): roll when the homelab CA changes (Node
# reads NODE_EXTRA_CA_CERTS only at startup). immich-credentials is left out:
# the bundled Postgres keeps the password it was initialised with, so
# restarting on a new one would only break the connection.
podAnnotations:
  configmap.reloader.stakater.com/reload: "homelab-root-ca"

# Disabled for now: no face recognition, smart search or duplicate
# detection. Saves ~0.5-2Gi RAM and a 10Gi model-cache PVC. The server
# still runs; those features just stay off until this is re-enabled.
machineLearning:
  enabled: false

# Passwords are pinned to the immich-credentials Secret. Left empty, the
# subcharts generate them with randAlphaNum + lookup, but Argo CD renders
# without cluster access, so every sync would produce a new password while
# Postgres keeps the one it was initialised with.
postgresql:
  auth:
    existingSecret: immich-credentials

valkey:
  auth:
    existingSecret: immich-credentials

# Chart-rendered HTTPRoute on the shared Traefik Gateway, on both listeners:
# *.lan (homelab CA) and the Let's Encrypt name, which the mobile app can use
# without installing the homelab CA. Each listener only serves the hostnames
# that match it. OAuth redirect URLs live in Immich's admin UI, not here.
gateway:
  enabled: true
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
    - name: traefik
      namespace: traefik
      sectionName: websecure-duckdns
  hostnames:
    - immich.lan
    - im.lan
    - immich.alextio.duckdns.org
