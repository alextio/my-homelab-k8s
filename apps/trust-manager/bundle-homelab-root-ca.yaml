# Publishes the homelab root CA (apps/cert-manager/certificate-homelab-root-ca.yaml)
# as ConfigMap `homelab-root-ca`, key `ca.crt`, in every namespace. Pods mount
# it to trust *.lan certs; see apps/dex/ for why services need that.
#
# Only our CA, not the public CA bundle: consumers add this file next to their
# image's own CA store rather than replacing it.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: homelab-root-ca
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # after the chart (wave 0): needs the Bundle CRD and webhook
spec:
  sources:
    - useDefaultCAs: false
    - secret:
        name: homelab-root-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
