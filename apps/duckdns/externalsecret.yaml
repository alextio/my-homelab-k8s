# DuckDNS account token for the duckdns webhook. It controls every subdomain
# on the DuckDNS account, so use an account that holds only the homelab one.
#
# Lives in cert-manager: the webhook reads it from the ClusterIssuer's
# resource namespace, and its RBAC only allows this one Secret there. The
# webhook fetches it per challenge, so no Reloader opt-in is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: duckdns-token
  namespace: cert-manager
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: duckdns-token
  data:
    - secretKey: token
      remoteRef:
        key: de62d124-29ac-4ce3-b3c6-b5080115689c  # cert-manager-duckdns-token
