# Builds the adguard-home-config Secret (AdGuardHome.yaml) from the template
# in configmap.yaml, injecting the admin bcrypt hash from Bitwarden so it
# never lands in git. The chart can't do this itself: its own ExternalSecret
# only maps remote keys 1:1 and has no template, so we ship ours and point
# the chart at the result via config.existingSecret in values.yaml.
#
# Rotating the password in Bitwarden updates the Secret but not the running
# config (see configmap.yaml: seeded once); change it in the UI, or delete
# the conf PVC to re-seed.
#
# Generate the hash with:  htpasswd -nbBC 10 "" '<password>' | tr -d ':\n'
# and store it in Bitwarden; put that secret's UUID below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguard-home-config
  namespace: adguard-home
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: adguard-home-config
    template:
      templateFrom:
        - configMap:
            name: adguard-home-config-template
            items:
              - key: AdGuardHome.yaml
                templateAs: Values
  data:
    - secretKey: adminHash
      remoteRef:
        key: a10134a6-4492-43bf-90aa-b4f30118f490
