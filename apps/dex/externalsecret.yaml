# Renders Dex's whole config.yaml from Bitwarden values so the bcrypt hash and
# client secret never land in git. Dex has no env-var form for staticPasswords
# hashes, hence templating the full file (the chart mounts it via
# configSecret.name in values.yaml).
#
# issuer must exactly match k3s's oidc-issuer-url and the CheCluster's
# identityProviderURL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-config
  namespace: dex
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: dex-config
    template:
      data:
        config.yaml: |
          issuer: https://dex.lan
          storage:
            type: kubernetes
            config:
              inCluster: true
          web:
            http: 0.0.0.0:5556
          oauth2:
            skipApprovalScreen: true
          enablePasswordDB: true
          staticPasswords:
            - email: alex@homelab.lan
              username: alex
              userID: "0fc5b381-b977-43f5-961d-4f7205c90dc5"
              hash: "{{ .userHash }}"
          staticClients:
            - id: che
              name: Eclipse Che
              secret: "{{ .cheClientSecret }}"
              redirectURIs:
                - https://che.lan/oauth/callback
  data:
    - secretKey: userHash
      remoteRef:
        key: 9e81642c-f7fe-41d3-9b10-b4f3014c72f2
    - secretKey: cheClientSecret
      remoteRef:
        key: 90604dff-ecf7-4422-9d89-b4f3014c7582
