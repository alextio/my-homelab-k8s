# Dex's secret values, as environment variables (envFrom in values.yaml). The
# config refers to them by name (hashFromEnv, secretEnv), so it stays in
# values.yaml without any secrets in Git. Each key here is the env var name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-env
  namespace: dex
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: dex-env
  data:
    - secretKey: DEX_ALEX_PASSWORD_HASH
      remoteRef:
        key: 9e81642c-f7fe-41d3-9b10-b4f3014c72f2
    - secretKey: DEX_CHE_CLIENT_SECRET
      remoteRef:
        key: 90604dff-ecf7-4422-9d89-b4f3014c7582
    - secretKey: DEX_ARGOCD_CLIENT_SECRET
      remoteRef:
        key: 052a2466-00db-4ec4-af4d-b50700eff853  # dex-argocd-client-secret
    - secretKey: DEX_CODER_CLIENT_SECRET
      remoteRef:
        key: 0ddb3b11-1d8b-4889-b149-b50700effa0d  # dex-coder-client-secret
    - secretKey: DEX_GRAFANA_CLIENT_SECRET
      remoteRef:
        key: 3ac2fe8c-d86c-4648-afb3-b50700effc67  # dex-grafana-client-secret
    - secretKey: DEX_IMMICH_CLIENT_SECRET
      remoteRef:
        key: 46039e46-62b8-403a-8fb5-b50700effe29  # dex-immich-client-secret
    - secretKey: DEX_OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: 0041de47-229f-4345-8294-b50700f000d3  # dex-oauth2-proxy-client-secret
