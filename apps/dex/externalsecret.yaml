# Renders Dex's whole config.yaml from Bitwarden values so the bcrypt hash and
# client secrets never land in git. Dex has no env-var form for staticPasswords
# hashes, hence templating the full file (the chart mounts it via
# configSecret.name in values.yaml).
#
# issuer must exactly match every client's issuer URL (and k3s's
# oidc-issuer-url, if the API server is ever pointed at Dex).
#
# Each client secret below is the same Bitwarden entry the consuming service's
# own ExternalSecret reads (Secrets can't be shared across namespaces). Immich
# is the exception: its OAuth settings live in its database, so that secret is
# pasted into the Immich admin UI instead.
#
# Dex reads this file only at startup. After changing it: delete the dex-config
# Secret so ESO re-renders it, then `kubectl -n dex rollout restart deploy/dex`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-config
  namespace: dex
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: dex-config
    template:
      data:
        config.yaml: |
          issuer: https://dex.lan
          storage:
            type: kubernetes
            config:
              inCluster: true
          web:
            http: 0.0.0.0:5556
          oauth2:
            skipApprovalScreen: true
          # Applies to every client. ID tokens are what services and kubectl
          # present; they can't be revoked, so keep them short. Refresh tokens
          # renew them silently and can be revoked (they live in the dex
          # namespace), so they get the longer limits.
          expiry:
            idTokens: 1h
            refreshTokens:
              # Log in again after a week without using it...
              validIfNotUsedFor: 168h
              # ...and at least every 30 days regardless.
              absoluteLifetime: 720h
          enablePasswordDB: true
          # One entry per person. userID must be a unique, stable UUID: it is
          # the token's `sub`, which services key accounts on.
          staticPasswords:
            - email: alex@homelab.lan
              username: alex
              userID: "0fc5b381-b977-43f5-961d-4f7205c90dc5"
              hash: "{{ .userHash }}"
          staticClients:
            - id: che
              name: Eclipse Che
              secret: "{{ .cheClientSecret }}"
              redirectURIs:
                - https://che.lan/oauth/callback
            - id: argocd
              name: Argo CD
              secret: "{{ .argocdClientSecret }}"
              redirectURIs:
                - https://argocd.lan/auth/callback
            # `argocd login --sso`: public client (no secret), the CLI listens
            # on localhost for the callback.
            - id: argocd-cli
              name: Argo CD CLI
              public: true
              redirectURIs:
                - http://localhost:8085/auth/callback
            - id: coder
              name: Coder
              secret: "{{ .coderClientSecret }}"
              redirectURIs:
                - https://coder.lan/api/v2/users/oidc/callback
            - id: grafana
              name: Grafana
              secret: "{{ .grafanaClientSecret }}"
              redirectURIs:
                - https://grafana.lan/login/generic_oauth
            - id: immich
              name: Immich
              secret: "{{ .immichClientSecret }}"
              redirectURIs:
                - https://immich.lan/auth/login
                - https://immich.lan/user-settings
                - https://im.lan/auth/login
                - https://im.lan/user-settings
                - app.immich:///oauth-callback
            # Forward-auth for services with no OIDC support of their own
            # (apps/oauth2-proxy/). The callback is served on each protected
            # host, so every host needs its own entry.
            - id: oauth2-proxy
              name: oauth2-proxy
              secret: "{{ .oauth2ProxyClientSecret }}"
              redirectURIs:
                - https://prometheus.lan/oauth2/callback
                - https://traefik.lan/oauth2/callback
                - https://192.168.6.200/oauth2/callback
                - https://adguard.lan/oauth2/callback
  data:
    - secretKey: userHash
      remoteRef:
        key: 9e81642c-f7fe-41d3-9b10-b4f3014c72f2
    - secretKey: cheClientSecret
      remoteRef:
        key: 90604dff-ecf7-4422-9d89-b4f3014c7582
    - secretKey: argocdClientSecret
      remoteRef:
        key: 052a2466-00db-4ec4-af4d-b50700eff853  # dex-argocd-client-secret
    - secretKey: coderClientSecret
      remoteRef:
        key: 0ddb3b11-1d8b-4889-b149-b50700effa0d  # dex-coder-client-secret
    - secretKey: grafanaClientSecret
      remoteRef:
        key: 3ac2fe8c-d86c-4648-afb3-b50700effc67  # dex-grafana-client-secret
    - secretKey: immichClientSecret
      remoteRef:
        key: 46039e46-62b8-403a-8fb5-b50700effe29  # dex-immich-client-secret
    - secretKey: oauth2ProxyClientSecret
      remoteRef:
        key: 0041de47-229f-4345-8294-b50700f000d3  # dex-oauth2-proxy-client-secret
