# CA issuer that signs service certificates with the homelab root CA.
# Reads the homelab-root-ca Secret from the cert-manager namespace (the
# default namespace for ClusterIssuer secret references).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # after the chart (wave 0); reports not-ready until the root CA Secret exists
spec:
  ca:
    secretName: homelab-root-ca
