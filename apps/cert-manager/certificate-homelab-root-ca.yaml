# Homelab root CA. Self-signed by selfsigned-root, then stored in the
# homelab-root-ca Secret, which homelab-ca reads to sign service certs.
#
# To trust everything issued under this CA, export ca.crt from the
# homelab-root-ca Secret and install it on each client (browser/OS).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-root-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  isCA: true
  commonName: homelab-root-ca
  secretName: homelab-root-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
